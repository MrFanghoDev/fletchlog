<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FletchLog</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1216">
<script>
  // Doit s'exécuter avant le premier paint, avant même theme.css --
  // sinon on voit un flash du thème par défaut avant bascule (voir
  // theme.js pour la logique de clic, qui pose la même clé localStorage).
  (function () {
    var t = localStorage.getItem("fletchlog_theme");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
    }
  })();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="leaflet.css">
<style>
  /* Ossature de l'appli (issue #1) -- header, bascule de vue, nav
     basse, FAB. Les deux vues restent des placeholders : leur contenu
     réel vient de #3 (Liste) et #7 (Carte). */
  .app { max-width: 480px; margin: 0 auto; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: env(safe-area-inset-top, 0) 16px 10px; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
  .brand svg { flex-shrink: 0; }
  .brand span { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
  .top-bar-controls { display: flex; align-items: center; gap: 6px; }

  main { position: relative; }
  .view { display: none; padding: 8px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
  .view.active { display: block; }
  .view-placeholder { color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 60px; }
  .view-empty { color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 60px; padding: 0 20px; }

  /* Vue Carte (issue #13) -- vraie carte OpenStreetMap (Leaflet, voir
     leaflet.js/leaflet.css vendorés), plus de fond décoratif ni de
     projection en % (l'ancienne approche stylisée de #7). Carte
     initialisée à la demande (voir initCarte()/actualiserPinsCarte()
     dans app.js) seulement au premier passage sur cette vue -- un
     conteneur caché (display:none tant que .view n'est pas .active) a
     une taille nulle, ce qui casse Leaflet s'il est initialisé dessus. */
  /* height: 65vh puis surchargé en 65dvh -- même piège déjà rencontré
     sur .app (voir CLAUDE.md, correctif du #3) : vh compte parfois la
     hauteur totale de l'écran, bandeau du navigateur inclus, ce qui
     rendait la carte plus haute que l'espace réellement visible et la
     faisait déborder sous la nav basse fixe sur un vrai appareil. dvh
     s'ajuste à l'espace effectivement visible ; vh reste en repli pour
     les navigateurs qui ne connaissent pas dvh. */
  /* isolation: isolate -- Leaflet donne à ses propres contrôles
     (attribution, zoom, notre bouton localiser) un z-index jusqu'à
     1000. Sans isolation, ce z-index n'est pas contenu à la carte : il
     rivalise directement avec le FAB/toast/nav (z-index 15 ou moins)
     ailleurs sur la page, et peut passer devant selon la position à
     l'écran -- constaté avec le FAB masqué par l'angle de la carte. */
  .carte-conteneur { position: relative; isolation: isolate; height: 65vh; height: 65dvh; min-height: 320px; border-radius: 16px; overflow: hidden; background: var(--surface-2); }
  #carte-leaflet { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--surface-2); }
  .leaflet-div-icon { background: none; border: none; }
  .pin-carte { display: flex; align-items: flex-end; justify-content: center; overflow: visible; cursor: pointer; }
  .pin-carte svg { width: 28px; height: 28px; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
  .pin-carte.pin-carte-actif svg { width: 38px; height: 38px; }
  /* Bouton "me localiser" -- contrôle Leaflet custom (voir ControleLocaliser
     dans app.js), calqué visuellement sur .leaflet-bar natif pour rester
     cohérent avec les boutons de zoom. */
  .carte-bouton-localiser {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 2px solid rgba(0,0,0,0.2); border-radius: 4px;
    color: var(--text); cursor: pointer; padding: 0;
  }
  .carte-bouton-localiser:hover { background: var(--surface-2); }
  .position-actuelle-pastille {
    width: 14px; height: 14px; border-radius: 50%; background: var(--blue);
    border: 2px solid var(--surface); box-shadow: 0 0 0 5px color-mix(in srgb, var(--blue) 30%, transparent);
  }
  /* position: fixed (pas absolute dans .carte-conteneur) -- même
     raisonnement que le FAB/toast/nav (voir le correctif de layout
     du #3) : indépendant de la hauteur calculée du conteneur carte,
     jamais recouvert par la nav basse fixe. */
  .carte-apercu {
    position: fixed; left: 16px; right: 88px; bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 12px; align-items: center; z-index: 15;
    padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3); cursor: pointer; text-align: left; font-family: inherit;
  }
  .carte-apercu[hidden] { display: none; }

  /* Chips de filtre -- <select> natif stylé en pilule plutôt qu'un
     menu déroulant construit à la main (positionnement, clic-dehors,
     navigation clavier) : moins de code, et le picker natif Android
     est déjà une bonne expérience mobile. */
  .recherche-commentaire { margin: 4px 0 10px; }
  .recherche-commentaire input { width: 100%; font-family: var(--font-ui); font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .recherche-commentaire input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  select.chip-select {
    appearance: none; -webkit-appearance: none; font-family: var(--font-ui);
    font-size: 12.5px; padding: 6px 26px 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235c6579" stroke-width="2.4" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg>') no-repeat right 8px center / 11px 11px;
    color: var(--text-muted); white-space: nowrap; flex-shrink: 0; cursor: pointer;
  }
  select.chip-select.active { border-color: var(--gold); background-color: var(--gold-dim); color: var(--gold); font-weight: 600; }

  /* Tri de la vue Liste (issue #17) -- propre à cette vue seule (le
     tri n'a pas de sens sur la vue Carte), donc en dehors du chip-row
     partagé entre les deux vues. */
  .tri-liste-ligne { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin: 0 0 10px; }
  .tri-liste-ligne label { font-size: 12.5px; color: var(--text-muted); }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .carte-entree { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; text-align: left; width: 100%; font-family: inherit; }
  .carte-vignette { position: relative; width: 58px; height: 58px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .vignette-badge { position: absolute; bottom: -3px; right: -3px; background: var(--gold); color: #1a1206; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 999px; border: 2px solid var(--surface); line-height: 1.3; }
  .carte-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .carte-titre { display: flex; align-items: center; gap: 5px; }
  .carte-titre span { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .carte-lieu { display: flex; align-items: center; gap: 5px; }
  .carte-lieu span { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge-discipline { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--gold-dim); color: var(--gold); white-space: nowrap; }
  .carte-sous { font-size: 12px; color: var(--text-muted); }
  .carte-labels { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .badge-label { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
  .carte-meteo { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); }
  .carte-commentaire { font-size: 12px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte-chevron { flex-shrink: 0; }

  .fab { position: fixed; right: 20px; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; background: var(--gold); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.35); color: #1a1206; cursor: pointer; z-index: 15; }
  .fab svg { display: block; }

  /* Formulaire d'ajout/édition -- superposition plein écran, reprend
     .field/.field label/input[type=text]/select/.btn-primary de
     theme.css (voir sa section "Champs de formulaire"). */
  .modal-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; overflow-y: auto; }
  .modal-overlay[hidden] { display: none; }
  .modal { padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 14px; max-width: 480px; margin: 0 auto; width: 100%; }
  .modal h2 { font-size: 1.15rem; margin: 0; }
  /* Position (issue #15) -- capture auto à l'ouverture pour une
     nouvelle entrée (inchangé), mais éditable dans les deux cas
     (ajout ET édition) : recapture, choix sur la carte, ou retrait.
     Avant #15, une édition ne pouvait jamais changer lat/lon -- voir
     CLAUDE.md pour le détail de la décision. */
  .position-statut { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .position-statut.ok { color: var(--green); }
  .position-statut.erreur { color: var(--text-faint); }
  .position-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bouton-mini { font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.7rem; border-radius: 8px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); cursor: pointer; }

  /* Sélecteur de position sur la carte -- pin fixe au centre, c'est la
     carte qui se déplace dessous (même convention que Google Maps/
     Uber pour ce genre de sélecteur : évite d'avoir à gérer un
     marqueur déplaçable au doigt, qui serait imprécis sur mobile). */
  .picker-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 25; display: flex; flex-direction: column; }
  .picker-overlay[hidden] { display: none; }
  /* isolation: isolate -- même correctif que .carte-conteneur (voir
     plus haut) : sans ça, le z-index des contrôles Leaflet (jusqu'à
     1000) passe devant le pin central au lieu de rester sous lui. */
  .picker-carte-zone { position: relative; isolation: isolate; flex: 1; }
  #picker-carte { position: absolute; inset: 0; }
  .picker-pin-centre { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); pointer-events: none; z-index: 15; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
  .picker-actions { display: flex; gap: 10px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--border); }
  .picker-actions button { flex: 1; }
  input[type=date], textarea {
    font-family: var(--font-ui); font-size: 0.9rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 0.5rem 0.6rem;
  }
  textarea { resize: vertical; }
  textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .form-erreur { color: var(--red); font-size: 0.85rem; margin: 0; min-height: 1.2em; }
  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .form-actions button { flex: 1; }
  .btn-annuler { background: var(--surface-2); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-supprimer { background: transparent; color: var(--red); border: 1px solid var(--red) !important; flex: 0 0 auto !important; }

  /* Dialogue de confirmation maison -- remplace window.confirm(),
     dont l'intitulé "<domaine> dit" (imposé par le navigateur, non
     personnalisable) affichait l'adresse GitHub Pages plutôt que
     "FletchLog", repéré par l'utilisateur en testant. */
  .confirm-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .confirm-overlay[hidden] { display: none; }
  .confirm-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .confirm-box p { margin: 0; font-size: 14px; color: var(--text); line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions button { flex: 1; }
  .confirm-actions .btn-supprimer { flex: 1 !important; }

  /* Galerie de photos du formulaire (issue #4, plusieurs photos depuis
     #12 -- jusqu'à 6, voir MAX_PHOTOS dans app.js). Une vignette par
     photo (existante ou tout juste choisie) + une tuile "+" tant que
     la limite n'est pas atteinte, qui déclenche l'input file caché. */
  .photo-galerie { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; }
  .photo-vignette-form { position: relative; width: 64px; height: 64px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); flex-shrink: 0; overflow: hidden; }
  .photo-vignette-form img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-vignette-retirer {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: #fff; border: none; display: flex; align-items: center;
    justify-content: center; cursor: pointer; padding: 0; line-height: 0;
  }
  .photo-ajouter {
    width: 64px; height: 64px; border-radius: 10px; background: var(--surface-2);
    border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; color: var(--text-muted); font-size: 1.4rem; font-family: inherit;
  }

  .carte-vignette img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }

  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; padding: 4px 22px; font-family: inherit; cursor: pointer; color: var(--text-faint); }
  .nav-btn svg { stroke: var(--text-faint); }
  .nav-btn.active { color: var(--gold); }
  .nav-btn.active svg { stroke: var(--gold); }
  .nav-btn span { font-size: 11px; }
  .nav-btn.active span { font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 8px 14px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s ease; z-index: 25; }
  .toast.visible { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <header class="top-bar">
    <a class="brand" href="index.html">
      <svg width="26" height="26" viewBox="0 0 24 24">
        <ellipse cx="12" cy="15.94" rx="7.03" ry="2.91" fill="none" stroke="var(--gold)" stroke-width="1.125"/>
        <ellipse cx="12" cy="15.94" rx="4.125" ry="1.6875" fill="none" stroke="var(--gold)" stroke-width="1.125"/>
        <g transform="translate(5.8125,4.59375) scale(0.515625)">
          <path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" fill="var(--gold)" stroke="#0f1216" stroke-width="1"/>
        </g>
        <circle cx="12" cy="15.94" r="0.5625" fill="var(--gold)"/>
      </svg>
      <span>FletchLog</span>
    </a>
    <div class="top-bar-controls">
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="system" onclick="setTheme('system')" data-i18n-aria-label="themeSystemLabel" aria-label="Thème système">◐</button>
        <button class="theme-btn" data-theme="light" onclick="setTheme('light')" data-i18n-aria-label="themeLightLabel" aria-label="Thème clair">☀</button>
        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" data-i18n-aria-label="themeDarkLabel" aria-label="Thème sombre">☾</button>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn" id="lang-fr-btn" onclick="setLanguage('fr')">FR</button>
        <button class="lang-btn" id="lang-en-btn" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Filtres/recherche partagés entre Liste et Carte (issue #7) --
         un seul jeu d'éléments, pas de doublon d'id par vue : les
         deux vues appellent entreesFiltrees() sur le même état. -->
    <div class="recherche-commentaire">
      <input type="search" id="recherche-commentaire" data-i18n-placeholder="rechercheCommentairePlaceholder" placeholder="Rechercher dans les commentaires...">
    </div>
    <div class="chip-row">
      <select class="chip-select" id="filtre-discipline"></select>
      <select class="chip-select" id="filtre-distance"></select>
      <select class="chip-select" id="filtre-lieu"></select>
      <select class="chip-select" id="filtre-label"></select>
    </div>

    <section id="view-liste" class="view active">
      <div class="tri-liste-ligne">
        <label for="tri-liste" data-i18n="triListeLabel">Trier :</label>
        <select class="chip-select" id="tri-liste">
          <option value="date-desc" data-i18n="triDateDesc">Plus récent</option>
          <option value="date-asc" data-i18n="triDateAsc">Plus ancien</option>
          <option value="titre-asc" data-i18n="triTitreAsc">Titre (A→Z)</option>
          <option value="lieu-asc" data-i18n="triLieuAsc">Lieu (A→Z)</option>
          <option value="discipline-asc" data-i18n="triDisciplineAsc">Discipline (A→Z)</option>
        </select>
      </div>
      <div class="card-list" id="liste-cartes"></div>
      <p class="view-empty" id="liste-vide" data-i18n="listeEmpty" hidden>Aucune sortie enregistrée -- ajoute la première avec le bouton +.</p>
    </section>
    <section id="view-carte" class="view">
      <div class="carte-conteneur" id="carte-conteneur">
        <div id="carte-leaflet"></div>
      </div>
      <p class="view-empty" id="carte-vide" data-i18n="carteEmpty" hidden>Aucune sortie géolocalisée pour l'instant -- les sorties sans position GPS n'apparaissent que dans la Liste.</p>
      <div class="carte-apercu" id="carte-apercu" hidden></div>
    </section>
  </main>

  <button class="fab" id="fab-add" data-i18n-title="fabTitle" title="Ajouter une sortie">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="toast" id="toast" hidden></div>

  <div class="modal-overlay" id="form-overlay" hidden>
    <div class="modal">
      <h2 id="form-titre" data-i18n="formTitreAjout">Nouvelle sortie</h2>
      <div class="field">
        <label data-i18n="positionLabel">Position</label>
        <div class="position-statut" id="position-statut">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
          <span id="position-statut-texte"></span>
        </div>
        <div class="position-actions">
          <button type="button" class="bouton-mini" id="position-recapturer" data-i18n="positionRecapturer">Recapturer</button>
          <button type="button" class="bouton-mini" id="position-choisir-carte" data-i18n="positionChoisirCarte">Choisir sur la carte</button>
          <button type="button" class="bouton-mini" id="position-retirer" data-i18n="positionRetirer" hidden>Retirer</button>
        </div>
      </div>
      <form id="form-entree">
        <div class="field">
          <label for="champ-titre" data-i18n="champTitreLabel">Titre</label>
          <input type="text" id="champ-titre" required data-i18n-placeholder="champTitrePlaceholder" placeholder="Ex. Entraînement du soir">
        </div>
        <div class="field">
          <label for="champ-lieu" data-i18n="formLieuLabel">Lieu</label>
          <input type="text" id="champ-lieu" required data-i18n-placeholder="formLieuPlaceholder" placeholder="Ex. Club Les Aigles 77">
        </div>
        <div class="field">
          <label for="champ-cible" data-i18n="formCibleLabel">Cible / blason</label>
          <input type="text" id="champ-cible" data-i18n-placeholder="formCiblePlaceholder" placeholder="Ex. Blason 18 m">
        </div>
        <div class="field">
          <label for="champ-discipline" data-i18n="formDisciplineLabel">Discipline</label>
          <input type="text" id="champ-discipline" data-i18n-placeholder="formDisciplinePlaceholder" placeholder="Ex. Indoor, Field, 3D...">
        </div>
        <div class="field">
          <label for="champ-distance" data-i18n="formDistanceLabel">Distance</label>
          <input type="text" id="champ-distance" data-i18n-placeholder="formDistancePlaceholder" placeholder="Ex. 18 m, Parcours varié...">
        </div>
        <div class="field">
          <label for="champ-labels" data-i18n="formLabelsLabel">Labels</label>
          <input type="text" id="champ-labels" list="labels-existants" data-i18n-placeholder="formLabelsPlaceholder" placeholder="Ex. amis, matériel test">
          <datalist id="labels-existants"></datalist>
        </div>
        <div class="field">
          <label for="champ-commentaire" data-i18n="formCommentaireLabel">Commentaire</label>
          <textarea id="champ-commentaire" rows="3" data-i18n-placeholder="formCommentairePlaceholder" placeholder="Notes libres sur cette sortie..."></textarea>
        </div>
        <div class="field">
          <label for="champ-meteo" data-i18n="formMeteoLabel">Météo</label>
          <select id="champ-meteo">
            <option value="aucune" data-i18n="meteoAucune">Non précisé</option>
            <option value="ensoleille" data-i18n="meteoEnsoleille">Ensoleillé</option>
            <option value="nuageux" data-i18n="meteoNuageux">Nuageux</option>
            <option value="pluie" data-i18n="meteoPluie">Pluie</option>
            <option value="vent" data-i18n="meteoVent">Vent</option>
          </select>
        </div>
        <div class="field">
          <label for="champ-date" data-i18n="formDateLabel">Date</label>
          <input type="date" id="champ-date" required>
        </div>
        <div class="field">
          <label data-i18n="formPhotoLabel">Photos</label>
          <div class="photo-galerie" id="photo-galerie"></div>
          <input type="file" accept="image/*" capture="environment" id="champ-photo" hidden>
        </div>
        <p class="form-erreur" id="form-erreur" data-i18n="formLieuRequis" hidden>Le lieu est obligatoire.</p>
        <div class="form-actions">
          <button type="button" class="btn-supprimer" id="form-supprimer" data-i18n="formSupprimer" hidden>Supprimer</button>
          <button type="button" class="btn-annuler" id="form-annuler" data-i18n="formAnnuler">Annuler</button>
          <button type="submit" class="btn-primary" data-i18n="formSauvegarder">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div class="picker-overlay" id="picker-overlay" hidden>
    <div class="picker-carte-zone">
      <div id="picker-carte"></div>
      <div class="picker-pin-centre">
        <svg width="32" height="32" viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" fill="var(--gold)"/><circle cx="12" cy="10" r="3.1" fill="#1a1206"/></svg>
      </div>
    </div>
    <div class="picker-actions">
      <button type="button" class="btn-annuler" id="picker-annuler" data-i18n="pickerAnnuler">Annuler</button>
      <button type="button" class="btn-primary" id="picker-valider" data-i18n="pickerValider">Valider cette position</button>
    </div>
  </div>

  <div class="confirm-overlay" id="confirm-overlay" hidden>
    <div class="confirm-box">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="btn-annuler" id="confirm-annuler" data-i18n="formAnnuler">Annuler</button>
        <button type="button" class="btn-supprimer" id="confirm-valider" data-i18n="formSupprimer">Supprimer</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="liste">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span data-i18n="navListe">Liste</span>
    </button>
    <button class="nav-btn" data-view="carte">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M9 20l-6-2V6l6 2 6-2 6 2v12l-6-2-6 2Z"/><path d="M9 8v12M15 6v12"/></svg>
      <span data-i18n="navCarte">Carte</span>
    </button>
  </nav>

</div>
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="sw-register.js"></script>
<script src="storage.js"></script>
<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
