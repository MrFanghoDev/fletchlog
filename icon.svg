<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0f1216"/>
  <!-- Cible : cercles concentriques aplatis (vus de côté), avec un
       liseré sombre comme le pin (retour utilisateur), même anneau
       dessiné deux fois, une fois plus large en fond sombre. -->
  <ellipse cx="256" cy="340" rx="150" ry="62" fill="none" stroke="#0f1216" stroke-width="30"/>
  <ellipse cx="256" cy="340" rx="150" ry="62" fill="none" stroke="#d1a13d" stroke-width="24"/>
  <ellipse cx="256" cy="340" rx="88" ry="36" fill="none" stroke="#0f1216" stroke-width="30"/>
  <ellipse cx="256" cy="340" rx="88" ry="36" fill="none" stroke="#d1a13d" stroke-width="24"/>
  <!-- Plume (issue #22, remplace le pin, même tracé que
       fletchapps/icon.svg), fût jusqu'au centre de la cible -->
  <g transform="translate(256,224.2) scale(6.2) translate(-44.843,-39.079)">
    <path stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#0f1216"
      d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
      style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
    <path stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#d1a13d"
      d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
      style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
  </g>
  <!-- Point central de la cible -->
  <circle cx="256" cy="340" r="12" fill="#d1a13d"/>
</svg>
